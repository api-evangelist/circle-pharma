traversal:
  embed: >-
    Add `_embed` to any request to inline featured media and taxonomy terms under `_embedded`,
    resolving every relationship above in a single round trip instead of N follow-up calls.
  links: >-
    Each record's `_links` object carries self / collection / about / author / replies /
    wp:featuredmedia / wp:term relations with absolute URLs (curie namespace https://api.w.org/{rel}).
