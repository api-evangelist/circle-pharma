note: >-
  Entity graph of the Circle Pharma Content API, derived from the content types and taxonomies the
  site registers and from the id-reference fields present in live records. Record counts are the
  X-WP-Total headers observed on 2026-08-01 and will drift. Only the publicly readable content
  entities are modelled; WordPress editorial internals (templates, blocks, fonts, widgets, plugins)
  are registered on the same namespace but are administrative, not content.
identifiers:
  scheme: integer surrogate key (`id`) per collection, unique within its content type
  human_key: '`slug`, unique within a content type; the public URL is in `link`'
  no_prefixes: >-
    Ids carry no type prefix, so an id is only meaningful together with its collection — an important
    difference from prefixed-id APIs.
