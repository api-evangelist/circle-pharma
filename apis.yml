aid: circle-pharma
name: Circle Pharma
description: >-
  Circle Pharma is a clinical-stage biopharmaceutical company in South San Francisco, California,
  developing cell-permeable, orally bioavailable macrocycle therapies for cancer. Founded in 2013 by
  Matthew P. Jacobson and Scott Lokey out of work on predicting synthetic macrocycle cell permeability,
  the company applies its proprietary MXMO structure-based design platform to protein-protein
  interactions that conventional small molecules cannot reach. Its pipeline targets cyclins, the
  regulators of the cell cycle that drive many cancers: lead program CID-078, a first-in-class oral
  cyclin A/B RxL inhibitor, is in Phase 1 for advanced solid tumors, followed by a preclinical cyclin
  D1 RxL inhibitor and undisclosed cyclin programs partnered with Boehringer Ingelheim. Circle Pharma
  closed a $90M Series D led by The Column Group in 2024 and has an agreement with Eli Lilly to use
  Lilly TuneLab to strengthen the AI/ML side of the MXMO platform. Circle Pharma runs no developer
  program and publishes no product API; the only machine-readable surface it exposes is the
  anonymously readable WordPress REST content API behind circlepharma.com.
