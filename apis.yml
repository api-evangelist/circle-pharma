apis:
- aid: circle-pharma:circle-pharma-content-api
  name: Circle Pharma Content API
  description: >-
    The anonymously readable WordPress REST API behind circlepharma.com. It exposes Circle Pharma
    press releases, publications and in-the-news items (posts), site pages, the media library, the
    leadership and board roster (team + member_type taxonomy), the events calendar (all_events +
    event_type taxonomy) and cross-content search. This is not a developer product Circle Pharma
    markets; it is the site's own discovery surface, published at /wp-json/ and verified to return
    data without credentials. The OpenAPI in this repo is derived from that published route index.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://circlepharma.com/wp-json
  tags:
  - content
  - press-releases
  - events
  - wordpress
