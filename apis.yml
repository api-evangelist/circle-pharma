  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://circlepharma.com/wp-json/ and verified against live anonymous responses on
    2026-08-01. Circle Pharma publishes no developer documentation, no API reference and no support
    channel for this surface, so no Documentation/APIReference/GettingStarted pointers are emitted —
    the humanURL above is the upstream WordPress REST handbook that describes the wp/v2 contract.
